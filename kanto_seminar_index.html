    var g = groups.find(function (x) { return x.kai === v.kai; });
    if (!g) groups.push((g = { kai: v.kai, rows: [] }));
    g.rows.push(v);
  });

    return '<section class="kai-group"><div class="kai-head"><h2>' + g.kai + '</h2>'

  } else {
    var lis = card.querySelectorAll(".card-body li");
    lis.forEach(function (li, i) { if (i >= VISIBLE) li.classList.add("hidden"); });
    btn.textContent = "すべて表示（残り" + (lis.length - VISIBLE) + "項目）";
  }
});

function apply() {
  var q = searchInput.value.trim().toLowerCase();
  render(items.filter(function (v) {
    if (activeTag && v.tags.indexOf(activeTag) === -1) return false;
    if (!q) return true;
    var hay = (v.kai + " " + (v.sub || "") + " " + v.title + " " + v.speaker + " "
      + v.tags.join(" ") + " " + (v.points || []).join(" ")).toLowerCase();
    return hay.indexOf(q) !== -1;
  }));
}

tagBar.addEventListener("click", function (e) {
  var btn = e.target.closest(".tag-btn");
  if (!btn) return;
  activeTag = btn.dataset.tag || null;
  tagBar.querySelectorAll(".tag-btn").forEach(function (b) { b.classList.toggle("active", b === btn); });
  apply();
});
searchInput.addEventListener("input", apply);

render(items);
</script>
</body>
</html>
